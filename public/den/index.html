<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>den — asif hassan</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- The destination lives in exactly two places: this meta refresh (the
       no-JS path) and DEST below. Change both together. -->
  <meta http-equiv="refresh" content="0; url=__MAPS_URL__">

  <script>
    // Fires before the meta refresh does, so the hop is imperceptible.
    // replace() rather than assign() — the back button should return to
    // wherever they came from, not bounce them straight back here.
    var DEST = "__MAPS_URL__";
    window.location.replace(DEST);
  </script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      font-size: 16px; font-weight: 300; background: #fff; color: #111;
      -webkit-font-smoothing: antialiased;
    }
    body { padding: 80px 24px; max-width: 560px; margin: 0 auto; }
    p { font-size: 0.95rem; line-height: 1.7; color: #333; }
    a { color: inherit; text-underline-offset: 2px; }
    @media (prefers-color-scheme: dark) {
      html { background: #111; color: #eee; }
      p { color: #ccc; }
    }
  </style>
</head>
<body>
  <!-- Only ever seen if both the script and the meta refresh are blocked. -->
  <p>Taking you to the map&hellip; <a href="__MAPS_URL__">open it directly</a>.</p>
</body>
</html>

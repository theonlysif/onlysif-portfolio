<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>the conversation</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    html {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px; font-weight: 300; background: #f5f5f5; color: #111;
      -webkit-font-smoothing: antialiased;
    }

    .bar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(245,245,245,0.94);
      border-bottom: 1px solid #ececec;
    }
    .bar a { color: #888; text-decoration: none; font-size: 0.85rem; flex-shrink: 0; }
    .bar a:hover { color: #111; }
    .bar .who { font-size: 0.85rem; font-weight: 400; text-align: center; min-width: 0; }
    .bar .meta { font-size: 0.75rem; color: #aaa; flex-shrink: 0; }

    #scroller {
      height: calc(100% - 49px);
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    #thread {
      max-width: 640px;
      margin: 0 auto;
      padding: 8px 0 48px;
    }

    .day {
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #aaa;
      padding: 20px 16px 12px;
    }

    .row {
      display: flex;
      width: 100%;
      padding: 3px 12px;
      box-sizing: border-box;
    }
    .row.me { justify-content: flex-end; }
    .row.them { justify-content: flex-start; }

    .stack {
      max-width: min(78%, 420px);
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .row.me .stack { align-items: flex-end; }
    .row.them .stack { align-items: flex-start; }

    .bubble {
      display: block;
      width: fit-content;
      max-width: 100%;
      padding: 8px 12px;
      border-radius: 18px;
      font-size: 0.92rem;
      line-height: 1.4;
      font-weight: 400;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: break-word;
      hyphens: none;
    }
    .row.them .bubble {
      background: #e9e9eb;
      color: #111;
      border-bottom-left-radius: 5px;
    }
    .row.me .bubble {
      background: #111;
      color: #fff;
      border-bottom-right-radius: 5px;
    }
    .bubble a { color: inherit; text-underline-offset: 2px; }
    .bubble.kind { font-weight: 300; }
    .row.target .bubble {
      outline: 2px solid #111;
      outline-offset: 3px;
    }

    .time {
      font-size: 0.65rem;
      color: #bbb;
      margin-top: 4px;
      padding: 0 4px;
    }

    @media (max-width: 480px) {
      .bar .who { display: none; }
      .stack { max-width: 84%; }
      .bubble { font-size: 0.9rem; }
    }

    @media (prefers-color-scheme: dark) {
      html { background: #111; color: #eee; }
      .bar { background: rgba(17,17,17,0.94); border-bottom-color: #222; }
      .bar a, .bar .meta, .day, .time { color: #666; }
      .bar a:hover { color: #eee; }
      .bar .who { color: #eee; }
      .row.them .bubble { background: #2a2a2a; color: #eee; }
      .row.me .bubble { background: #eee; color: #111; }
      .row.target .bubble { outline-color: #eee; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <a href="./index.html">← timeline</a>
    <div class="who">you are on the right</div>
    <div class="meta" id="meta">loading…</div>
  </div>
  <div id="scroller">
    <div id="thread"></div>
  </div>
  <script src="./thread.js"></script>
</body>
</html>
